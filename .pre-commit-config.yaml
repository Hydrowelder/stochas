repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.17
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.11.21
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.11.21
    hooks:
      - id: uv-export
  # - repo: https://github.com/RobertCraigie/pyright-python
  #   rev: v1.1.410
  #   hooks:
  #     - id: pyright
  - repo: https://github.com/astral-sh/ty-pre-commit
    # ty version.
    rev: v0.0.95
    hooks:
      - id: ty
        # ty checks against the project environment that `uv check` syncs from uv.lock, not
        # pre-commit's own, so the optional extras must be installed for their imports to
        # resolve (pydantic_ai, mjviser, viser); --frozen keeps uv.lock from being updated
        args: [--frozen, --all-extras]
  - repo: local
    hooks:
      - id: act-test
        name: Run GitHub Actions locally (act)
        entry: act -j test
        language: system
        stages: [pre-push]
        pass_filenames: false
        files: ^(src/|tests/|pyproject\.toml|uv\.lock)
  - repo: local
    hooks:
      - id: verify-changelog-tag
        name: Verify CHANGELOG.md entry and date for current tag push
        entry: python scripts/verify_changelog_by_tag.py
        language: python
        stages: [pre-push]
        pass_filenames: false
        always_run: true
